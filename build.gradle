plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Photo mode (-PphotoMode): the client game test shoots the screenshots for the website and
// README at ultra quality with shaders. Sodium and Iris join only that run; the shader pack and
// its settings are placed in the run folder by hand (they are not part of this repository).
def photoMode = project.hasProperty("photoMode")

repositories {
	if (photoMode) {
		exclusiveContent {
			forRepository { maven { url = "https://api.modrinth.com/maven" } }
			filter { includeGroup "maven.modrinth" }
		}
	}
}

// build.ps1 passes -PexternalBuild when the sources sit in a synced (OneDrive) folder: build
// output, test worlds and logs then live under the Gradle user home instead. Elsewhere (and in
// CI) the usual build/ and run/ folders are used.
def external = project.hasProperty("externalBuild")
if (external) {
	layout.buildDirectory = new File(gradle.gradleUserHomeDir, "mistinn-build")
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			if (external) {
				runDir = new File(gradle.gradleUserHomeDir, "mistinn-run/client").absolutePath
			}
			programArgs "--username", "Hunter"
		}
		server {
			if (external) {
				runDir = new File(gradle.gradleUserHomeDir, "mistinn-run/server").absolutePath
			}
		}
	}

	mods {
		"mistinn" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests: a real client plays the core loop and saves screenshots
// (run with: build.ps1 runClientGameTest). No dedicated-server tests, so no EULA is accepted here.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mistinn-test"
		enableGameTests = false
		enableClientGameTests = true
		// photo mode keeps the run folder: the shader pack lives there
		clearRunDirectory = !photoMode
	}
}

// Single test (-PonlyTest=<ClassName>): the client game test runs only that test class.
if (project.hasProperty("onlyTest")) {
	loom.runs.configureEach {
		if (name == "clientGameTest") {
			vmArg "-Dmistinn.only=${project.onlyTest}"
		}
	}
}

// Clip report (-PclipReport): the finisher overlap test only measures and writes its report, without failing.
if (project.hasProperty("clipReport")) {
	loom.runs.configureEach {
		if (name == "clientGameTest") {
			vmArg "-Dmistinn.clipreport=true"
		}
	}
}

// Animation sheet (-PanimSheet): the client game test freezes each swing at its beats and
// screenshots them in first and third person, to judge the animation frame by frame.
if (project.hasProperty("animSheet")) {
	loom.runs.configureEach {
		if (name == "clientGameTest") {
			vmArg "-Dmistinn.animsheet=true"
		}
	}
}

// Motion reel (-PmotionReel): every body animation filmed as dense frame runs, for strips and GIFs.
if (project.hasProperty("motionReel")) {
	loom.runs.configureEach {
		if (name == "clientGameTest") {
			vmArg "-Dmistinn.reel=true"
		}
	}
}

// Medical reel (-PmedicalReel): every medical and repair use filmed as frame runs, with its HUD.
if (project.hasProperty("medicalReel")) {
	loom.runs.configureEach {
		if (name == "clientGameTest") {
			vmArg "-Dmistinn.medreel=true"
		}
	}
}

if (photoMode) {
	loom.runs.configureEach {
		if (name == "clientGameTest") {
			vmArg "-Dmistinn.photo=true"
			// some of the scenes only (-PphotoSet=death,executions); all of them when unset
			if (project.hasProperty("photoSet")) {
				vmArg "-Dmistinn.photoset=${project.photoSet}"
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	if (photoMode) {
		runtimeOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
		runtimeOnly "maven.modrinth:iris:1.11.7+26.3-fabric"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
