name: Release

# Pushing a tag vX.Y.Z builds that commit and publishes a GitHub Release with the mod's JAR.
# The tag must match `version` in gradle.properties. The client game test needs a display and
# is not run here: run it locally before tagging (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the tag against the version
        run: |
          version="$(grep -E '^version=' gradle.properties | cut -d= -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/mistinn-$VERSION.jar"
          test -f "$jar"
          gh release create "$GITHUB_REF_NAME" "$jar" \
            --title "Mistinn: Exile $VERSION" \
            --generate-notes \
            --verify-tag
