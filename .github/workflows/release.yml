name: Release

# Pushing a tag vX.Y.Z builds that commit and publishes a GitHub Release with the mod's JAR.
# The tag must match `version` in gradle.properties. The client game test needs a display and
# is not run here: run it locally before tagging (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*.*.*"]

# Nothing here may write to the repository except the job that publishes.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the version
        id: version
        run: |
          version="$(grep -E '^version=' gradle.properties | cut -d= -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: release-jar
          path: build/libs/mistinn-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-jar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "mistinn-$VERSION.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mistinn: Exile $VERSION" \
            --generate-notes \
            --verify-tag
