name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Style
        run: ./gradlew checkstyleMain checkstyleClient checkstyleGametest --no-daemon
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: mistinn-jar
          path: build/libs/*.jar
